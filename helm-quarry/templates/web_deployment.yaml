apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.repository }}:{{ .Values.web.tag }}
          imagePullPolicy: Always
          command: ["gunicorn"]
          # gthread seems to behave better
          args: ["-w", "4", "-k", "gthread", "--threads", "4", "--bind", "0.0.0.0:5000", "wsgi:application"]
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 4
            # the liveness check hits the DB and such, it might be slower than 1s
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: "/results"
              name: results
            - name: config
              mountPath: /app/quarry/config.yaml
              subPath: config.yaml
            - mountPath: /tmp
              name: tmp
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: results
{{ if .Values.localdev.enabled }}
          persistentVolumeClaim:
            claimName: results
{{ else }}
          nfs:
            server: {{ .Values.nfs.server }}
            path: /srv/quarry/project/quarry/results/
{{ end }}
        - name: config
          configMap:
            name: config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
